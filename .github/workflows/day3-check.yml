name: Day3 Check
on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check structure
        run: |
          test -f app.py
          test -f config.py
          test -f models.py
          test -f routes/auth.py
          test -f routes/events.py
          test -f routes/registrations.py
          test -f utils/auth_helpers.py
      - name: Syntax check
        run: |
          python -m py_compile app.py
          python -m py_compile config.py
          python -m py_compile models.py
      - name: Done
        run: echo "PASS: Day3 Backend Check completed"
        
